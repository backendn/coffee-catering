<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4b3621" />

    <!-- Primary SEO -->
    <title>Soma Coffee Products &amp; Catering | Addis Ababa, Ethiopia</title>
    <meta name="description" content="Soma Coffee — fresh roasted coffee powder, washed quality beans from Yirgacheffe & Gojjam, plus full event catering in Addis Ababa: weddings, birthdays, meetings, enjera & agelgel delivery." />
    <meta name="keywords" content="coffee powder Addis Ababa, Ethiopian coffee, coffee delivery Ethiopia, catering Addis Ababa, wedding catering Ethiopia, enjera delivery, agelgel delivery, Soma coffee, Yirgacheffe coffee, roasted coffee Ethiopia" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sommacoffee.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Soma Coffee Products & Catering | Addis Ababa, Ethiopia" />
    <meta property="og:description" content="Fresh roasted Ethiopian coffee delivered to your door, plus full event catering in Addis Ababa, Ethiopia." />
    <meta property="og:url" content="https://sommacoffee.com/" />
    <meta property="og:image" content="https://sommacoffee.com/images/packages/01.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Soma Coffee & Catering" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soma Coffee Products & Catering | Addis Ababa, Ethiopia" />
    <meta name="twitter:description" content="Fresh roasted Ethiopian coffee delivered to your door, plus full event catering in Addis Ababa, Ethiopia." />
    <meta name="twitter:image" content="https://sommacoffee.com/images/packages/01.jpg" />

    <!-- Structured data: tells Google this is a local business, powers
         rich results (address, phone, map) in search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Soma Coffee Products & Catering",
      "image": "https://sommacoffee.com/images/packages/01.jpg",
      "url": "https://sommacoffee.com/",
      "telephone": "+251911317531",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Addis Ababa",
        "addressCountry": "ET"
      },
      "servesCuisine": "Ethiopian",
      "areaServed": "Addis Ababa"
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Noto+Sans+Ethiopic:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
